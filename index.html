<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Calculadora de Craft</title>
<style>
  :root{
    --bege:#e9dfc9;
    --bege-escuro:#d8caa8;
    --card:#f5efdd;
    --texto:#3b3226;
    --sub:#7a6f5a;
    --accent:#8a6d3b;
    --accent2:#5c7a4a;
    --linha:#cbb98f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    background:var(--bege);
    background-image: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.25), transparent 60%);
    color:var(--texto);
    min-height:100vh;
    padding:24px;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
  }
  h1{
    font-size:26px;
    margin:0;
    letter-spacing:0.5px;
  }
  .brand{
    font-family:Georgia, 'Times New Roman', serif;
    font-weight:bold;
    font-style:italic;
    font-size:22px;
    color:var(--accent);
    letter-spacing:1px;
    text-shadow:1px 1px 0 rgba(255,255,255,0.4);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--linha);
    border-radius:14px;
    padding:18px 18px 20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
    border-bottom:1px solid var(--linha);
    padding-bottom:12px;
  }
  .card-head img{
    width:64px;
    height:auto;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3));
  }
  .card-head h2{
    margin:0;
    font-size:20px;
  }
  .card-head span{
    font-size:12px;
    color:var(--sub);
  }
  .req-list{
    list-style:none;
    padding:0;
    margin:0 0 14px 0;
    font-size:14px;
  }
  .req-list li{
    display:flex;
    justify-content:space-between;
    padding:4px 0;
    border-bottom:1px dashed var(--linha);
  }
  .req-list li:last-child{border-bottom:none;}
  .req-name{color:var(--sub);}
  .req-val{font-weight:600;}
  .inputs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:14px;
  }
  .inputs label{
    font-size:12px;
    color:var(--sub);
    display:block;
    margin-bottom:3px;
  }
  .inputs input{
    width:100%;
    padding:7px 8px;
    border:1px solid var(--linha);
    border-radius:8px;
    background:#fffdf6;
    color:var(--texto);
    font-size:14px;
  }
  .inputs input:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .full{grid-column:1 / -1;}
  .result{
    background:var(--bege-escuro);
    border-radius:10px;
    padding:12px 14px;
    font-size:14px;
  }
  .result .qty{
    font-size:28px;
    font-weight:bold;
    color:var(--accent2);
    line-height:1;
  }
  .result .time{
    margin-top:6px;
    color:var(--sub);
  }
  .result .limit{
    margin-top:6px;
    font-size:12px;
    color:#a5563a;
  }
  footer{
    text-align:center;
    margin-top:30px;
    font-size:12px;
    color:var(--sub);
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Calculadora de Craft</h1>
  <div class="brand">Maldinis</div>
</div>

<div class="grid" id="grid"></div>

<footer>Insere os materiais que tens disponiveis e ve quantas armas consegues craftar e o tempo total.</footer>

function fmtTime(totalSeconds){
  if(totalSeconds <= 0) return "0s";
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = Math.floor(totalSeconds%60);
  let parts = [];
  if(h>0) parts.push(h+"h");
  if(m>0) parts.push(m+"m");
  if(s>0 || parts.length===0) parts.push(s+"s");
  return parts.join(" ");
}

function buildCard(c){
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <div class="card-head">
      <img src="${c.img}" alt="${c.nome}">
      <div>
        <h2>${c.nome}</h2>
        <span>Tempo por unidade: ${c.tempo}s</span>
      </div>
    </div>
    <ul class="req-list">
      <li><span class="req-name">Molas</span><span class="req-val">${c.req.molas}</span></li>
      <li><span class="req-name">Kits Ferramenta</span><span class="req-val">${c.req.kits}</span></li>
      <li><span class="req-name">Pecas</span><span class="req-val">${c.req.pecas}</span></li>
      <li><span class="req-name">${c.corpoNome}</span><span class="req-val">${c.req.corpo}</span></li>
      <li><span class="req-name">${c.blueprintNome}</span><span class="req-val">${c.req.blueprint}</span></li>
    </ul>
    <div class="inputs">
      <div>
        <label>Molas</label>
        <input type="number" min="0" value="0" data-mat="molas" data-craft="${c.id}">
      </div>
      <div>
        <label>Kits Ferramenta</label>
        <input type="number" min="0" value="0" data-mat="kits" data-craft="${c.id}">
      </div>
      <div>
        <label>Pecas</label>
        <input type="number" min="0" value="0" data-mat="pecas" data-craft="${c.id}">
      </div>
      <div>
        <label>${c.corpoNome}</label>
        <input type="number" min="0" value="0" data-mat="corpo" data-craft="${c.id}">
      </div>
      <div class="full">
        <label>${c.blueprintNome}</label>
        <input type="number" min="0" value="0" data-mat="blueprint" data-craft="${c.id}">
      </div>
    </div>
    <div class="result" id="result-${c.id}">
      <div class="qty">0 unidades</div>
      <div class="time">Tempo total: 0s</div>
    </div>
  `;
  return div;
}

function calc(c){
  const inputs = document.querySelectorAll(`input[data-craft="${c.id}"]`);
  const vals = {};
  inputs.forEach(inp => { vals[inp.dataset.mat] = parseFloat(inp.value) || 0; });

  let possiveis = [];
  for(const key in c.req){
    const need = c.req[key];
    const have = vals[key] || 0;
    possiveis.push(Math.floor(have / need));
  }
  const qty = Math.min(...possiveis);
  const totalTime = qty * c.tempo;

  const resDiv = document.getElementById(`result-${c.id}`);
  let limitante = "";
  if(qty === 0){
    const nomes = {molas:"Molas", kits:"Kits Ferramenta", pecas:"Pecas", corpo:c.corpoNome, blueprint:c.blueprintNome};
    let minIdx = possiveis.indexOf(Math.min(...possiveis));
    let keys = Object.keys(c.req);
    limitante = `<div class="limit">Falta material: ${nomes[keys[minIdx]]}</div>`;
  }

  resDiv.innerHTML = `
    <div class="qty">${qty} unidade${qty===1?'':'s'}</div>
    <div class="time">Tempo total: ${fmtTime(totalTime)}</div>
    ${limitante}
  `;
}

const grid = document.getElementById("grid");
crafts.forEach(c => grid.appendChild(buildCard(c)));

document.querySelectorAll("input[data-craft]").forEach(inp => {
  inp.addEventListener("input", () => {
    const craft = crafts.find(c => c.id === inp.dataset.craft);
    calc(craft);
  });
});

crafts.forEach(c => calc(c));
</script>

</body>
</html>
